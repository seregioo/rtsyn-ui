[package]
name = "rtsyn-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
arboard = "3"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.27"
egui = "0.27"
egui_plot = "0.27"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
plantuml_encoding = "2.0.3"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "ttf", "svg_backend"] }
rfd = "0.15.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
ureq = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
comedi = []
embedded-daemon = []

[lib]
name = "rtsyn_ui"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
